<div class="section-card home-news">
<h3>News</h3>
<div class="news-timeline">
{% for article in site.data.news limit:3 %}
<div class="news-item">
<span class="news-date">{{ article.date | date: "%m/%Y" }}:</span>
<span class="news-headline">
{% if article.url %}
<a href="{{ article.url | relative_url }}{% if article.anchor %}#{{ article.anchor }}{% endif %}">{{ article.headline }}</a>
{% else %}
{{ article.headline }}
{% endif %}
</span>
</div>
{% endfor %}
</div>
<p class="news-more"><a href="{{ site.url }}{{ site.baseurl }}/allnews.html">See all news &rarr;</a></p>
</div>
